:root{
  --bg:#FBF7F2;--bg2:#F2EBE3;--card:#FFFFFF;--ink:#2E2526;--muted:#73676A;--faint:#A1979A;--line:#EADFDA;
  --primary:#A3333D;--primary-h:#8C2832;--on-primary:#FFFFFF;--primary-soft:#F4E1DF;--primary-ink:#8A2A33;
  --accent:#2F5D46;--accent-soft:#DDE9E0;--accent-ink:#2F5D46;
  --gold:#C49A45;--gold-soft:#F6EBD3;--gold-ink:#86661F;--rose:#D47C7C;--rose-soft:#F8E1E0;--rose-ink:#9A3B3B;--slate:#8A95AA;
  --hero:linear-gradient(135deg,#F4E1DF 0%,#F6EEE2 100%);
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px;--fs:16px;--shadow:0 1px 2px rgba(60,40,40,.05),0 6px 20px rgba(60,40,40,.05);
}
[data-theme="evergreen"]{--bg:#F6F7F2;--bg2:#ECEFE7;--line:#E0E5DB;--ink:#24302A;--primary:#2F5D46;--primary-h:#264D3A;--primary-soft:#DDE9E0;--primary-ink:#2A5340;--accent:#A3333D;--accent-soft:#F4E1DF;--accent-ink:#8A2A33;--hero:linear-gradient(135deg,#DDE9E0 0%,#F4EEE2 100%)}
[data-theme="gold"]{--bg:#FBF8F2;--bg2:#F2ECE0;--line:#E9E0CF;--ink:#2F2A22;--primary:#9A7B3F;--primary-h:#836631;--primary-soft:#F3EADA;--primary-ink:#715A28;--accent:#7A6A55;--accent-soft:#EFE9DF;--accent-ink:#5E503D;--hero:linear-gradient(135deg,#F3EADA 0%,#FAF5EC 100%)}
[data-theme="emerald"]{--bg:#F6F6F0;--bg2:#ECECE2;--line:#E1E0D3;--ink:#1F2B27;--primary:#1F6B57;--primary-h:#175746;--primary-soft:#DCEBE5;--primary-ink:#185746;--accent:#B8913E;--accent-soft:#F2E8D0;--accent-ink:#7A5E22;--gold:#B8913E;--hero:linear-gradient(135deg,#DCEBE5 0%,#F2E8D0 100%)}
[data-theme="marigold"]{--bg:#FCF7F1;--bg2:#F4EBE0;--line:#ECDFCF;--ink:#33251E;--primary:#B9572A;--primary-h:#9E4720;--primary-soft:#F7E3D2;--primary-ink:#933F1A;--accent:#7A3E6E;--accent-soft:#F1E2EC;--accent-ink:#6A3460;--gold:#D49A2A;--hero:linear-gradient(135deg,#F7E3D2 0%,#F8EFD8 100%)}
[data-theme="nordic"]{--bg:#F6F7F7;--bg2:#EBEEEF;--line:#DFE4E6;--ink:#232B30;--muted:#66727A;--primary:#4F6B7A;--primary-h:#425A67;--primary-soft:#E1E8EC;--primary-ink:#3D5462;--accent:#A3333D;--accent-soft:#F4E1DF;--accent-ink:#8A2A33;--hero:linear-gradient(135deg,#E1E8EC 0%,#F4F1EC 100%)}
[data-theme="night"]{color-scheme:dark;--bg:#1D1F24;--bg2:#282B31;--card:#282B31;--ink:#EEEAE4;--muted:#B5AFA8;--faint:#857F78;--line:#3A3E45;
  --primary:#D9B26A;--primary-h:#E6C383;--on-primary:#1D1F24;--primary-soft:#3F3829;--primary-ink:#F0D9A8;
  --accent:#C9737A;--accent-soft:#45303A;--accent-ink:#F0C2C6;--gold:#D9B26A;--gold-soft:#433822;--gold-ink:#E7C88E;--rose:#D88A90;--rose-soft:#4A3134;--rose-ink:#F0C6CA;
  --hero:linear-gradient(135deg,#2E3038 0%,#3A3226 100%);--shadow:0 1px 2px rgba(0,0,0,.3)}
[data-size="s"]{--fs:15px}[data-size="l"]{--fs:18px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.serif,.tile .v,.stat .v{font-feature-settings:"lnum" 1;font-variant-numeric:lining-nums}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:2.1rem;line-height:1.1}h2{font-size:1.55rem;line-height:1.15}h3{font-size:1.2rem}
p{margin:.3rem 0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:.82rem}.tiny{font-size:.72rem}
.eyebrow{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.15rem;display:block;line-height:1.1;white-space:nowrap}
.brand small{font-size:.62rem;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.tabs{margin-left:auto;display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:.9rem}
.tab:hover{background:var(--bg2)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.botnav{display:none}
main{max-width:1040px;margin:0 auto;padding:22px 18px 110px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card+.card,.stack>*+*{margin-top:14px}
.hero{background:var(--hero);border:1px solid var(--line);border-radius:18px;padding:20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .v{font-family:var(--serif);font-size:1.35rem;line-height:1.2}
.tile .l{font-size:.64rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:600}
.tile .s{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--serif);font-size:1.7rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols>*{margin-top:0!important}
.scale button b svg{width:1.4em;height:1.4em}
.stat .l{font-size:.64rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-top:2px}
.stat .s{font-size:.75rem;color:var(--muted)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{background:var(--primary-h)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 11px;font-size:.8rem}
.btn.danger{color:#B3473F}
.btn svg,.ico{width:16px;height:16px;flex:none}
.link{background:none;border:0;padding:0;color:var(--primary-ink);cursor:pointer;font-size:.85rem;font-weight:500}
[data-theme="night"] .link{color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.74rem;background:var(--primary-soft);color:var(--primary-ink)}
.pill.lav{background:var(--accent-soft);color:var(--accent-ink)}
.pill.gold{background:var(--gold-soft);color:#7A5A1E}[data-theme="night"] .pill.gold{color:var(--gold)}
.pill.rose{background:var(--rose-soft);color:var(--rose-ink)}
/* chips & forms */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.84rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}

const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pkey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => dkey(new Date());
const addDays = (k, n) => { const d = pkey(k); d.setDate(d.getDate()+n); return dkey(d); };
const diffDays = (a, b) => Math.round((pkey(b) - pkey(a)) / 864e5);
const rangeKeys = (n, end=todayKey()) => { const a=[]; for (let i=n-1;i>=0;i--) a.push(addDays(end,-i)); return a; };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const fmtLong = k => { const d = pkey(k); return `${WDF[d.getDay()]}, ${MONF[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
const fmtMid = k => { const d = pkey(k); return `${WD[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`; };

function money(v){
  const n = num(v), c = DB.settings.currency || '$', cents = Math.abs(n - Math.round(n)) > 0.004;

let toastT;
function toast(msg, undo){
  $$('.toast').forEach(t=>t.remove()); clearTimeout(toastT);
  const t = document.createElement('div'); t.className='toast'; t.innerHTML = `<span>${esc(msg)}</span>${undo?'<button>Undo</button>':''}`;
  document.body.appendChild(t);
  if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); };
  toastT = setTimeout(()=>t.remove(), 4200);
}
function modal(title, body, foot, opts={}){
  closeModal();
  const ov = document.createElement('div'); ov.className='ov'; ov.id='ov';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="hd"><h2 style="font-size:1.4rem">${title}</h2><button class="x" aria-label="Close">${ic('x')}</button></div><div class="bd">${body}</div>${foot?`<div class="ft">${foot}</div>`:''}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target===ov && !opts.sticky) closeModal(); });
  $('.x', ov).onclick = closeModal;
  document.body.style.overflow='hidden';
  return ov;
}
function closeModal(){ const o=$('#ov'); if(o){ o.remove(); document.body.style.overflow=''; } }

/* ---------- charts (pure SVG, offline) ---------- */
function barChart(vals, labels, o={}){
  const W=o.w||(innerWidth<760?380:640), H=o.h||150, pl=24, pb=20, pt=8, n=vals.length, max=Math.max(o.max||0, ...vals, 1);
  const bw=(W-pl)/n, gap=Math.min(6, bw*.3);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let g=0; g<=2; g++){ const y=pt+(H-pt-pb)*(1-g/2); s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${g?'3 4':''}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${r1(max*g/2).replace(/\.0$/,'')}</text>`; }
  vals.forEach((v,i)=>{ const h=(H-pt-pb)*(v/max), x=pl+i*bw+gap/2, y=H-pb-h;
    if (v>0) s+=`<rect x="${x}" y="${y}" width="${Math.max(bw-gap,1.5)}" height="${h}" rx="${Math.min(3,(bw-gap)/2)}" fill="${o.color||'var(--gold)'}"><title>${esc(labels[i]||'')}: ${r1(v)}</title></rect>`;
    const every = o.every || Math.ceil(n/8);
    if (labels[i] && i%every===0) s+=`<text x="${x+(bw-gap)/2}" y="${H-5}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return s+'</svg>';
}
function lineChart(series, labels, o={}){
  const W=o.w||(innerWidth<760?380:640), H=o.h||160, pl=24, pb=20, pt=10, n=labels.length, min=o.min??0, max=o.max??Math.max(...series.flatMap(s=>s.vals.filter(v=>v!=null)),1);
  const X=i=>pl+(n<=1?0:(W-pl-8)*i/(n-1)), Y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min||1));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  const ticks = o.ticks || [min,(min+max)/2,max];
  ticks.forEach(t=>{ s+=`<line x1="${pl}" x2="${W}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl-6}" y="${Y(t)+3}" text-anchor="end">${o.fmt?o.fmt(t):r1(t).replace(/\.0$/,'')}</text>`; });
  const every = o.every || Math.ceil(n/7);
  labels.forEach((l,i)=>{ if(i%every===0) s+=`<text x="${X(i)}" y="${H-5}" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(se=>{
    let d='', area='', started=false, lastX=0, firstX=0;
    se.vals.forEach((v,i)=>{ if(v==null) return; d+=(started?'L':'M')+X(i)+' '+Y(v)+' '; if(!started) firstX=X(i); started=true; lastX=X(i); });
    if (!started) return;
    if (se.fill) s+=`<path d="${d}L${lastX} ${H-pb} L${firstX} ${H-pb} Z" fill="${se.color}" opacity=".12"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    se.vals.forEach((v,i)=>{ if(v!=null) s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="var(--card)" stroke="${se.color}" stroke-width="1.6"><title>${esc(labels[i])}: ${o.fmt?o.fmt(v):r1(v)}</title></circle>`; });
  });
  return s+'</svg>';
}

/* ---------- photo storage (IndexedDB, stays on device) ---------- */
const PH = {cache:{}, db:null};
function phDB(){ return PH.db || (PH.db = new Promise((res,rej)=>{ try { const r=indexedDB.open(APP.photoDB,1); r.onupgradeneeded=()=>r.result.createObjectStore('p'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); } catch(e){ rej(e); } })); }
async function phPut(id, data){ const db=await phDB(); return new Promise((res,rej)=>{ const t=db.transaction('p','readwrite'); t.objectStore('p').put(data,id); t.oncomplete=()=>{PH.cache[id]=data;res();}; t.onerror=()=>rej(t.error); }); }
async function phGet(id){ if (PH.cache[id]) return PH.cache[id]; const db=await phDB(); return new Promise(res=>{ const r=db.transaction('p').objectStore('p').get(id); r.onsuccess=()=>{ PH.cache[id]=r.result; res(r.result); }; r.onerror=()=>res(null); }); }
async function phDel(id){ delete PH.cache[id]; const db=await phDB(); return new Promise(res=>{ const t=db.transaction('p','readwrite'); t.objectStore('p').delete(id); t.oncomplete=res; t.onerror=res; }); }
async function phAll(){ const db=await phDB(); return new Promise(res=>{ const out={}; const r=db.transaction('p').objectStore('p').openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; r.onerror=()=>res(out); }); }
function shrink(file, max=1400){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; im.onerror=rej; im.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }
function pickPhoto(){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=async()=>{ if(!i.files[0]) return res(null); try{ res(await shrink(i.files[0])); }catch(e){ toast("That image couldn't be opened."); res(null);} }; i.click(); }); }

const HTYPE_ORDER = ['christmas','thanksgiving','eid','eidadha','ramadan','diwali','hanukkah','easter','newyear','birthday','custom'];
const typeOf = h => HTYPES[h.type] || HTYPES.custom;

/* ---------- router ---------- */
const S = {view:'today', sub:null, pseg:'todo', gf:'all', gq:'', fseg:'recipes'};
const TABS = [['today','Today','today'],['gifts','Gifts','gift'],['budget','Budget','wallet'],['plan','Plan','list'],['more','More','more']];
const THEME_COLOR = {red:'#A3333D', evergreen:'#2F5D46', gold:'#9A7B3F', emerald:'#1F6B57', marigold:'#B9572A', nordic:'#4F6B7A', night:'#1D1F24'};
function go(view, sub=null){ S.view=view; S.sub=sub; render(); window.scrollTo(0,0); }
function render(){
  document.documentElement.dataset.theme = DB.settings.theme;
  document.documentElement.dataset.size = DB.settings.size;
  const mt = $('meta[name=theme-color]'); if (mt) mt.content = THEME_COLOR[DB.settings.theme] || '#A3333D';
  $('#tabs').innerHTML = TABS.map(([k,l])=>`<button class="tab ${S.view===k?'on':''}" data-go="${k}">${l}</button>`).join('');
  $('#botnav').innerHTML = TABS.map(([k,l,i])=>`<button class="${S.view===k?'on':''}" data-go="${k}">${ic(i)}<span>${l}</span></button>`).join('');
  const V = {today:vToday, gifts:vGifts, budget:vBudget, plan:vPlan, more:vMore}[S.view] || vToday;
  $('#app').innerHTML = (H() || S.view==='more' ? V() : vNoHoliday()) + `<div class="foot">${APP.name} · v${APP.version} · ${APP.studio}<br>Private and offline — everything stays on this device.</div>`;
  bindPage(); afterRender();
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g){ e.preventDefault(); go(g.dataset.go, g.dataset.sub||null); return; }
  const a = e.target.closest('[data-act]'); if (a){ if (a.type!=='checkbox') e.preventDefault(); ACT[a.dataset.act]?.(a.dataset.arg, a, e); }
});
const ACT = {};
let bindPage = () => {};
let afterRender = () => { $$('img[data-photo]').forEach(async im=>{ const d=await phGet(im.dataset.photo).catch(()=>null); if(d) im.src=d; else im.closest('.photo')?.classList.add('missing'); }); };
const seg = (key, opts, cur) => `<div class="seg" role="tablist">${opts.map(([k,l])=>`<button class="${cur===k?'on':''}" data-act="seg" data-arg="${key}|${k}">${l}</button>`).join('')}</div>`;
ACT.seg = arg => { const [k,v]=arg.split('|'); S[k]=v; render(); };

/* ---------- holiday model ---------- */
const H = () => DB.holidays.find(h=>h.id===DB.settings.active) || DB.holidays[0] || null;
function listFrom(obj){ const out=[]; Object.entries(obj||{}).forEach(([cat,items])=>items.forEach(t=>out.push({id:uid()+out.length, text:t, cat, done:false}))); return out; }
function defaultTasks(type){ const t=HTYPES[type]||HTYPES.custom, out=[]; WHEN.forEach(([w])=>[...((t.tasks||{})[w]||[]), ...(BASE_TASKS[w]||[])].forEach(x=>out.push({id:uid()+out.length, text:x, when:w, done:false}))); return out; }
function newHoliday(type, name, date){
  const t = HTYPES[type]||HTYPES.custom;
  return {id:uid(), type, name:name||t.label, date:date||'', budget:0, plan:{}, people:[], gifts:[], expenses:[], tasks:defaultTasks(type), events:[], recipes:[], shopping:[], guests:[], cards:[],
          santa:{members:[], limit:'', date:'', pairs:null}, memories:[], fav:listFrom(t.fav), notes:'', nextYear:''};
}
function ensureHoliday(h){ const b=newHoliday(h.type,h.name,h.date); Object.keys(b).forEach(k=>{ if (h[k]==null) h[k]=b[k]; }); if(!h.santa.members) h.santa=b.santa; return h; }
const daysLeft = h => h && h.date ? diffDays(todayKey(), h.date) : null;
function curWhen(h){ const d=daysLeft(h); if (d==null) return null; if (d<0) return 'after'; if (d===0) return 'd0'; if (d===1) return 'd1'; for (const [w,,min] of WHEN.slice(0,3)) if (d>=min) return w; return 'w1'; }
const whenLabel = w => (WHEN.find(x=>x[0]===w)||[])[1]||'';
const whenIx = w => WHEN.findIndex(x=>x[0]===w);
const cats = h => { const c=typeOf(h).cats.map(x=>x[0]); Object.keys(h.plan||{}).forEach(k=>{ if(!c.includes(k)) c.push(k); }); h.expenses.forEach(e=>{ if(!c.includes(e.cat)) c.push(e.cat); }); return c; };
const giftCat = h => cats(h).find(c=>/^gifts/i.test(c)) || null;
const giftSpent = (h, pid) => round2(h.gifts.filter(g=>g.status!=='Idea' && (!pid||g.person===pid)).reduce((s,g)=>s+num(g.price),0));
const giftPlanned = (h, pid) => round2(h.gifts.filter(g=>!pid||g.person===pid).reduce((s,g)=>s+num(g.price),0));
const cardSpent = h => round2(h.cards.filter(c=>c.sent).reduce((s,c)=>s+num(c.amount),0));
function catSpent(h, c){
  let s = h.expenses.filter(e=>e.cat===c).reduce((a,e)=>a+num(e.amount),0);
  if (c===giftCat(h)) s += giftSpent(h);
  if (typeOf(h).cardMoney && c===typeOf(h).cardCat) s += cardSpent(h);
  return round2(s);
}
function budgetSum(h){ const spent = round2(cats(h).reduce((s,c)=>s+catSpent(h,c),0)), budget=num(h.budget); return {budget, spent, left:round2(budget-spent), planned:round2(Object.values(h.plan||{}).reduce((s,v)=>s+num(v),0))}; }
function giftStats(h){ const G=h.gifts, by=st=>G.filter(g=>g.status===st).length; return {total:G.length, idea:by('Idea'), bought:by('Bought'), wrapped:by('Wrapped'), given:by('Given'), ready:by('Wrapped')+by('Given'), people:h.people.length, spent:giftSpent(h), budget:round2(h.people.reduce((s,p)=>s+num(p.budget),0))}; }
const personNeeds = (h,p) => !h.gifts.some(g=>g.person===p.id);
function ring(p, label, sub){
  const r=54, c=2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 132 132"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--card)" stroke-width="12"/><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--primary)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(1,p)))}" transform="rotate(-90 66 66)"/><text x="66" y="68" text-anchor="middle" font-size="30">${label}</text><text x="66" y="90" text-anchor="middle" font-size="12" style="font-family:var(--sans);fill:var(--muted)">${sub}</text></svg>`;
}

/* ---------- no holiday yet ---------- */
function vNoHoliday(){ return `<div class="hero" style="text-align:center;padding:40px 20px"><h1>Which holiday are you planning?</h1><p class="muted" style="margin-top:8px">Christmas, Eid, Diwali, Thanksgiving, a birthday — pick one to start. You can add more any time.</p><button class="btn pri" style="margin-top:16px" data-act="holAdd">${ic('plus')} Add a holiday</button></div>`; }

/* ---------- today ---------- */
function vToday(){
  const h = H(), d = daysLeft(h), gs = giftStats(h), b = budgetSum(h), t = typeOf(h);
  const td = h.tasks.filter(x=>x.done).length;
  let count;
  if (d==null) count = `<button class="btn pri" data-act="holEdit" data-arg="${h.id}">${ic('calendar')} Set the date</button>`;
  else if (d>0) count = `<div class="count"><span class="big">${d}</span><span>${d===1?'day':'days'} to ${esc(h.name)}${d>13?` · about ${Math.round(d/7)} weeks`:''}</span></div>`;
  else if (d===0) count = `<div class="count"><span class="big">Today</span><span>is ${esc(h.name)} — enjoy every moment ♡</span></div>`;
  else count = `<div class="count"><span class="big">${-d}</span><span>${-d===1?'day':'days'} since ${esc(h.name)}</span></div>`;
  const cw = curWhen(h), ci = cw?whenIx(cw):0;
  const open = h.tasks.filter(x=>!x.done), late = cw ? open.filter(x=>whenIx(x.when)<ci) : [];
  const next = [...late, ...open.filter(x=>x.when===(cw||'w4')), ...open.filter(x=>whenIx(x.when)>ci)].slice(0,5);
  const ev = h.events.filter(e=>e.date>=todayKey()).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,3);
  const need = h.people.filter(p=>personNeeds(h,p)), shop = h.shopping.filter(x=>!x.done).length;
  const steps = [[!!h.date,'Set the date','holEdit',h.id],[num(h.budget)>0,'Set your budget','setBudget',''],[h.people.length>0,'Add the people you are buying for','personAdd','']];
  return `<div class="hero"><div class="between" style="align-items:center;flex-wrap:nowrap;gap:16px">
    <div class="grow"><div class="eyebrow">${h.date?fmtLong(h.date):t.label}${DB.holidays.length>1?` · <button class="link" data-act="holSwitch">Switch holiday ›</button>`:''}</div>
      <h1 style="margin-top:6px">${esc(h.name)}</h1>${DB.settings.name?`<p class="muted">${esc(DB.settings.name)}'s plan</p>`:''}
      <div style="margin-top:12px">${count}</div></div>
    ${ring(gs.total?gs.ready/gs.total:0, gs.total?Math.round(gs.ready/gs.total*100)+'%':'—', 'gifts ready')}</div></div>
  ${steps.some(x=>!x[0])?`<div class="card" style="margin-top:14px"><h3>Three quick steps</h3><div class="list" style="margin-top:6px">${steps.map(([ok,l,a,arg])=>`<div><span class="stepdot ${ok?'on':''}">${ok?ic('check'):''}</span><div class="grow ${ok?'done-t':''}">${l}</div>${ok?'':`<button class="btn sm" data-act="${a}" data-arg="${arg}">Do it</button>`}</div>`).join('')}</div></div>`:''}
  <div class="grid g4" style="margin-top:14px">
    <button class="tile tl" data-go="gifts"><div class="l">Gifts ready</div><div class="v">${gs.ready}/${gs.total}</div><div class="s">${gs.bought} bought · ${gs.idea} ideas</div></button>
    <button class="tile tl" data-go="budget"><div class="l">Spent</div><div class="v">${money(b.spent)}</div><div class="s">${b.budget?(b.left<0?`${money(-b.left)} over budget`:`${money(b.left)} left of ${money(b.budget)}`):'Set a budget'}</div></button>
    <button class="tile tl" data-go="plan"><div class="l">To-do</div><div class="v">${td}/${h.tasks.length}</div><div class="s">${h.tasks.length?Math.round(td/h.tasks.length*100):0}% done</div></button>
    <button class="tile tl" data-act="toFood" data-arg="shopping"><div class="l">Shopping list</div><div class="v">${shop}</div><div class="s">items to buy</div></button>
  </div>
  <div class="cols" style="margin-top:14px">
    <div class="card"><div class="between"><h3>Up next</h3><button class="link" data-go="plan">Plan ›</button></div>
      ${cw?`<p class="small muted">${whenLabel(cw)}</p>`:'<p class="small muted">Set the date to see what to do and when.</p>'}
      ${late.length?`<p class="small" style="color:var(--rose-ink);margin-top:4px">${plural(late.length,'task')} from earlier still open</p>`:''}
      <div class="list" style="margin-top:6px">${next.map(x=>`<div><input type="checkbox" class="chk" data-act="taskTog" data-arg="${x.id}" aria-label="Done"><div class="grow">${esc(x.text)}<div class="tiny faint">${whenLabel(x.when)}</div></div></div>`).join('')||'<p class="empty">All done — enjoy!</p>'}</div></div>
    <div class="stack">
      <div class="card"><div class="between"><h3>Coming up</h3><button class="link" data-act="toEvents">Events ›</button></div>
        <div class="list" style="margin-top:6px">${ev.map(e=>`<div><span class="datebox"><b>${pkey(e.date).getDate()}</b><small>${MON[pkey(e.date).getMonth()]}</small></span><div class="grow">${esc(e.title)}<div class="tiny faint">${e.time?fmtTime(new Date('2000-01-01T'+e.time)):''}${e.place?' · '+esc(e.place):''}</div></div></div>`).join('')||'<p class="small muted" style="padding:8px 0">No events yet. Add parties, dinners and school shows in Plan.</p>'}</div></div>
      <div class="card"><div class="between"><h3>Still need a gift</h3><button class="link" data-go="gifts">Gifts ›</button></div>
        ${need.length?`<div class="chips" style="margin-top:8px">${need.map(p=>`<button class="pill lav" data-act="giftNew" data-arg="${p.id}">${esc(p.name)} +</button>`).join('')}</div>`:`<p class="small muted" style="margin-top:6px">${h.people.length?'Everyone on your list has at least one gift. 🎁':'Add the people you are buying for.'}</p>`}</div>
    </div>
  </div>`;
}
ACT.taskTog = id => { const x=H().tasks.find(t=>t.id===id); if(!x) return; x.done=!x.done; save(); render(); if (x.done) toast('Done!', ()=>{ x.done=false; save(); render(); }); };
ACT.toFood = k => { S.fseg=k; go('more','food'); };
ACT.toEvents = () => { S.pseg='events'; go('plan'); };

/* ---------- holidays: add / edit / switch ---------- */
function holForm(h, isNew){
  return `${isNew?`<div class="sec"><h4>Which holiday?</h4><div class="htypes" id="hf-t">${HTYPE_ORDER.map(k=>`<button class="opt ${h.type===k?'on':''}" data-k="${k}">${HTYPES[k].label}</button>`).join('')}</div></div>`:''}
   <div class="grid g2 sec"><div><label class="f">Name</label><input type="text" id="hf-n" value="${esc(h.name)}" placeholder="Christmas 2026"></div><div><label class="f">Date</label><input type="date" id="hf-d" value="${h.date||''}"></div></div>
   <p class="tiny faint" id="hf-hint" style="margin-top:6px">${['eid','eidadha','ramadan','diwali','hanukkah','easter'].includes(h.type)?'This date changes every year — please add the expected date (you can change it later).':''}</p>`;
}
ACT.holAdd = () => {
  const h = {type:'christmas', name:'', date:''};
  const ov = modal('Add a holiday', holForm(h,true), `<button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Add</button>`);
  const pick = k => { h.type=k; $$('#hf-t .opt',ov).forEach(o=>o.classList.toggle('on',o.dataset.k===k)); const t=HTYPES[k]; const n=$('#hf-n',ov); if(!n.dataset.touched) n.value = t.label+(k==='birthday'||k==='custom'?'':' '+(t.date()||todayKey()).slice(0,4)); $('#hf-d',ov).value=t.date()||''; $('#hf-hint',ov).textContent = t.date()?'':'This date changes every year or is yours to choose — please add it (you can change it later).'; };
  $('#hf-t',ov).onclick = e => { const o=e.target.closest('.opt'); if(o){ e.preventDefault(); pick(o.dataset.k); } };
  $('#hf-n',ov).oninput = e => e.target.dataset.touched='1';
  pick('christmas');
  $('[data-c]',ov).onclick = closeModal;
  $('[data-s]',ov).onclick = () => { const n=$('#hf-n',ov).value.trim()||HTYPES[h.type].label; const nh=newHoliday(h.type, n, $('#hf-d',ov).value); DB.holidays.push(nh); DB.settings.active=nh.id; if (DB.holidays.length===1) DB.settings.theme=HTYPES[h.type].theme; save(); closeModal(); go('today'); toast(`${n} added`); };
};
ACT.holEdit = id => {
  const h = DB.holidays.find(x=>x.id===id) || H(); if(!h) return;
  const ov = modal('Edit holiday', holForm(h,false), `<button class="btn danger ghost" data-del style="margin-right:auto">Delete</button><button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Save</button>`);
  $('[data-c]',ov).onclick = closeModal;
  $('[data-del]',ov).onclick = () => confirmBox(`Delete ${esc(h.name)} and everything in it (gifts, budget, lists, photos)?`, async()=>{ for (const m of h.memories) if (m.photo) await phDel(m.photo); DB.holidays=DB.holidays.filter(x=>x.id!==h.id); DB.settings.active=DB.holidays[0]?.id||''; save(); go('today'); });
  $('[data-s]',ov).onclick = () => { const n=$('#hf-n',ov).value.trim(); if(!n){ toast('Give it a name'); return; } h.name=n; h.date=$('#hf-d',ov).value; save(); closeModal(); render(); toast('Saved'); };
};
ACT.holSwitch = () => {
  const ov = modal('Your holidays', `<div class="list" style="margin-top:8px">${DB.holidays.map(h=>`<div class="clk" data-pick="${h.id}"><span class="stepdot ${h.id===H().id?'on':''}">${h.id===H().id?ic('check'):''}</span><div class="grow">${esc(h.name)}<div class="tiny faint">${typeOf(h).label}${h.date?' · '+fmtShort(h.date)+' '+h.date.slice(0,4):''}</div></div></div>`).join('')}</div>`,
    `<button class="btn" data-act="holAdd">${ic('plus')} Add a holiday</button>`);
  $$('[data-pick]',ov).forEach(r=>r.onclick=()=>{ DB.settings.active=r.dataset.pick; save(); closeModal(); go('today'); });
};
ACT.holNext = id => {
  const h = DB.holidays.find(x=>x.id===id) || H(); const t=typeOf(h);
  const nd = h.date ? (()=>{ const d=pkey(h.date); d.setFullYear(d.getFullYear()+1); return dkey(d); })() : '';
  const date = h.type==='thanksgiving' && nd ? thanksgivingUS(+nd.slice(0,4)) : nd;
  const name = /\d{4}/.test(h.name) ? h.name.replace(/\d{4}/, m=>+m+1) : h.name+' (next year)';
  const nh = newHoliday(h.type, name, date);
  nh.budget = h.budget; nh.plan = {...h.plan};
  nh.people = h.people.map(p=>({...p, id:p.id}));
  nh.tasks = h.tasks.map(x=>({...x, id:uid()+x.id.slice(-3), done:false}));
  nh.recipes = h.recipes.map(r=>({...r}));
  nh.guests = h.guests.map(g=>({...g, rsvp:'Pending'}));
  nh.cards = h.cards.map(c=>({...c, sent:false, received:false}));
  nh.santa = {members:[...h.santa.members], limit:h.santa.limit, date:'', pairs:null};
  nh.fav = h.fav.map(f=>({...f, done:false}));
  nh.notes = h.nextYear ? 'Notes from last year:\n'+h.nextYear : '';
  DB.holidays.push(nh); DB.settings.active=nh.id; save(); go('today'); toast(`${name} created from ${h.name}`);
};

/* ---------- gifts ---------- */
const stCls = s => s==='Given'?'':s==='Wrapped'?'gold':s==='Bought'?'rose':'lav';
function vGifts(){
  const h = H(), gs = giftStats(h), q = S.gq.trim().toLowerCase(), f = S.gf;
  const show = g => (f==='all'||g.status===f) && (!q || [g.item,g.note,(h.people.find(p=>p.id===g.person)||{}).name].join(' ').toLowerCase().includes(q));
  const ppl = h.people.slice().sort((a,b)=>a.name.localeCompare(b.name));
  return `<div class="between"><div><h1>Gifts</h1><p class="muted">Everyone you are buying for, their budget, and every gift from idea to given.</p></div>
   <div class="row"><button class="btn sm" data-act="printGifts">${ic('print')} Print</button><button class="btn sm" data-act="csvGifts">${ic('down')} CSV</button></div></div>

function vTodo(){
  const h=H(), cw=curWhen(h), ci=cw?whenIx(cw):-1, dn=h.tasks.filter(t=>t.done).length;

  ${WHEN.map(([w,l],i)=>{ const T=h.tasks.filter(t=>t.when===w), d=T.filter(t=>t.done).length, now=w===cw, late=ci>=0&&i<ci&&w!=='after'&&d<T.length, open=now||late||(ci<0&&i===0)||S.openW===w;
    return `<details class="acc ph ${now?'now':''}" data-w="${w}" ${open?'open':''}><summary><span class="phn">${i+1}</span><span class="grow"><b style="font-weight:500">${l}</b>${now?' <span class="pill">Now</span>':''}${late?' <span class="pill rose">Catch up</span>':''}</span><span class="small faint">${d}/${T.length}</span></summary>
     <div class="b"><div class="list">${T.map(t=>`<div><input type="checkbox" class="chk" data-act="taskTog2" data-arg="${t.id}" ${t.done?'checked':''} aria-label="Done"><div class="grow ${t.done?'done-t':''}" style="color:var(--ink)">${esc(t.text)}</div><button class="btn ghost sm" data-act="taskEdit" data-arg="${t.id}">Edit</button></div>`).join('')||'<p class="small faint" style="padding:6px 0">Nothing here yet.</p>'}</div>
     <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="text" class="taskin" data-w="${w}" placeholder="Add a task…"><button class="btn sm" data-act="taskAdd" data-arg="${w}" aria-label="Add">${ic('plus')}</button></div></div></details>`; }).join('')}
  <p style="margin-top:14px"><button class="link" data-act="taskReset">Restore suggested tasks</button></p>`;

/* secret santa */
function drawPairs(n){ const idx=[...Array(n).keys()]; for (let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*i); [idx[i],idx[j]]=[idx[j],idx[i]]; } return idx; } /* Sattolo: one cycle, nobody draws themselves */
SUBV.santa = () => {
  const s=H().santa, M=s.members, P=s.pairs;
  return `<h1>Secret Santa</h1><p class="muted">Add everyone in the gift exchange, then draw. Each person taps their own name to see who they are buying for — nobody gets themselves.</p>

function samplePhoto(label, c1, c2, kind){
  const c=document.createElement('canvas'); c.width=600; c.height=760; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,600,760); gr.addColorStop(0,c1); gr.addColorStop(1,c2); g.fillStyle=gr; g.fillRect(0,0,600,760);
  g.fillStyle='rgba(255,255,255,.75)';
  if (kind==='tree'){ g.beginPath(); g.moveTo(300,170); g.lineTo(150,600); g.lineTo(450,600); g.closePath(); g.fill(); g.fillRect(280,600,40,60); }
  else if (kind==='lantern'){ g.fillRect(250,250,100,240); g.beginPath(); g.arc(300,250,50,Math.PI,0); g.fill(); }
  else { for (let i=0;i<12;i++){ g.beginPath(); g.arc(120+(i%4)*120,300+Math.floor(i/4)*120,26,0,7); g.fill(); } }
  g.fillStyle='rgba(40,30,30,.55)'; g.font='500 46px Georgia'; g.textAlign='center'; g.fillText(label,300,120); g.font='20px sans-serif'; g.fillText('sample photo',300,720);
  return c.toDataURL('image/jpeg',.8);
}

  const ev=(title,off,time,place,note)=>h.events.push({id:uid()+h.events.length, title, date:addDays(xd,-off), time, place, note:note||''});
  ev('School holiday play',14,'18:00','Maple Elementary','Emma is an angel'); ev('Office party',10,'19:30','The Grand Hall','Bring the Secret Santa gift'); ev('Cookie swap at Kate\'s',6,'14:00','Aunt Kate\'s','Bring 3 dozen'); ev('Christmas Eve church service',1,'17:00','St. Mary\'s',''); ev('Christmas dinner',0,'15:00','Home','12 guests');
  h.recipes=[['Roast turkey','Main','12','4 hr','1 turkey (about 6 kg)\nButter\nFresh thyme\nLemons\nOnions'],['Roast potatoes','Side','8','1 hr','2 kg potatoes\nOlive oil\nRosemary\nSea salt'],['Cranberry sauce','Side','10','20 min','340 g cranberries\nSugar\nOrange'],['Gingerbread cookies','Dessert','24','1 hr','Flour\nGround ginger\nMolasses\nBrown sugar\nButter\nEgg'],['Mulled cider','Drinks','10','30 min','Apple cider\nCinnamon sticks\nCloves\nOrange']].map(([name,course,serves,time,ing],i)=>({id:uid()+i, name, course, serves, time, ing, steps:''}));
  ['1 turkey (about 6 kg)','Butter','Fresh thyme','2 kg potatoes','Rosemary'].forEach((t,i)=>h.shopping.push({id:uid()+'s'+i, text:t, cat:'Groceries', done:i<2, from:i<3?'Roast turkey':'Roast potatoes'}));
  [['Wrapping paper','Gifts'],['Gift tags','Gifts'],['Extra fairy lights','Decor'],['Napkins','Party']].forEach(([t,c],i)=>h.shopping.push({id:uid()+'x'+i, text:t, cat:c, done:false}));
  h.guests=[['Grandma Rose',1,'Yes','Stuffing'],['Aunt Kate & family',4,'Yes','Dessert'],['Uncle Tom',2,'Maybe',''],['The Garcias',3,'Yes','Wine'],['Cousin Mia',1,'Pending','']].map(([name,count,rsvp,bring],i)=>({id:uid()+i, name, count, rsvp, bring, note:''}));
  h.cards=[['Grandma Rose','12 Oak Lane',1,1],['The Garcias','',1,0],['Aunt Kate','',1,1],['Uncle Tom','',0,0],['Ms. Lee','',0,0],['The Patels','',1,1],['Old college friends','',0,0]].map(([name,address,s,r],i)=>({id:uid()+i, name, address, amount:'', sent:!!s, received:!!r}));
  h.santa={members:['Mom','Dad','Emma','Noah','Aunt Kate','Uncle Tom'], limit:'20', date:addDays(xd,-1), pairs:null};
  h.fav.forEach((f,i)=>f.done=i%3===0);
  h.notes='Turkey order: pick up Dec 22.\nCards: post by Dec 15.';
  h.nextYear='Start gift shopping in October. Buy a bigger tree stand!';
  for (const [k,t,n,c1,c2,kind] of [['Tradition','Christmas Eve pajamas','New pajamas and a movie every Christmas Eve.','#F4D9D7','#E9C6C2','tree'],['Memory','Our first gingerbread house','Leaning, but delicious.','#F3E7D3','#E5D2B4','dots']]){
    const id='m'+uid(); try { await phPut(id, samplePhoto(t.split(' ')[0], c1, c2, kind)); h.memories.push({id:uid(), kind:k, title:t, note:n, photo:id}); } catch(e){ h.memories.push({id:uid(), kind:k, title:t, note:n, photo:''}); }
  }
  DB.holidays.push(h);
  /* a second, lighter holiday to show multi-holiday */
  const e = newHoliday('eid', 'Eid ul Fitr '+(y+1), `${y+1}-03-20`); e.budget=800; typeOf(e).cats.forEach(([c,p])=>e.plan[c]=Math.floor(800*p/100));
  e.cards=[['Ali',50,0],['Sara',50,0],['Hamza',30,0],['Zainab',30,0]].map(([name,amount,s],i)=>({id:uid()+i, name, address:'', amount, sent:!!s, received:false}));
  DB.holidays.push(e);
  DB.settings.active = h.id; DB.settings.name = DB.settings.name || 'Sarah'; DB.settings.theme = DB.settings.theme || 'red';
}

/* ---------- welcome ---------- */
function welcome(){
  let type='christmas';
  const ov = modal('Welcome <span style="color:var(--primary)">♡</span>', `
    <p class="muted" style="margin-top:12px">One calm place for gifts, budget, to-dos, menus and memories — for any holiday you celebrate.</p>
    <div class="sec"><label class="f">Your name <span class="faint">(optional)</span></label><input type="text" id="w-name" placeholder="Sarah" value="${esc(DB.settings.name)}"></div>
    <div class="sec"><h4>What are you planning first?</h4><div class="htypes" id="w-t">${HTYPE_ORDER.map(k=>`<button class="opt ${k===type?'on':''}" data-k="${k}">${HTYPES[k].label}</button>`).join('')}</div><p class="tiny faint" style="margin-top:6px">You can add more holidays any time.</p></div>
    <div class="private small" style="margin-top:16px">${ic('lock')} No account, no cloud, no subscription. Everything stays on this device.</div>`,
    `<button class="btn" data-demo>${ic('sparkle')} Explore with sample data</button><button class="btn pri" data-start>Start planning</button>`, {sticky:true});
  $('.x', ov).style.display='none';
  $('#w-t',ov).onclick = e => { const o=e.target.closest('.opt'); if(!o) return; e.preventDefault(); type=o.dataset.k; DB.settings.theme=HTYPES[type].theme; document.documentElement.dataset.theme=DB.settings.theme; $$('#w-t .opt',ov).forEach(x=>x.classList.toggle('on',x===o)); };
  const done = async demo => { DB.settings.name=$('#w-name',ov).value.trim(); DB.settings.setup=true;
    if (demo){ await makeDemo(); DB.settings.demo=true; }
    else { const t=HTYPES[type], d=t.date(); const nh=newHoliday(type, t.label+(['birthday','custom'].includes(type)?'':' '+(d||todayKey()).slice(0,4)), d); DB.holidays.push(nh); DB.settings.active=nh.id; DB.settings.theme=t.theme; }
    save(); closeModal(); render(); if(demo) toast('Sample holidays loaded — clear them any time in Settings'); else if (!H().date) toast('Add the date for '+H().name+' to start the countdown'); };
  $('[data-start]',ov).onclick = () => done(false); $('[data-demo]',ov).onclick = () => done(true);
}

/* ---------- init ---------- */
load(); DB.holidays.forEach(ensureHoliday);
$('#logo').innerHTML = LOGO;
render();
if (!DB.settings.setup) welcome();
window.addEventListener('afterprint', ()=>{ $('#print').innerHTML=''; });
let rzT, lastW = innerWidth; window.addEventListener('resize', ()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if ((innerWidth<760)!==(lastW<760) && !$('#ov')) render(); lastW=innerWidth; },200); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/localhost|127\.0\.0\.1/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
